# dsh-homepage bundle patch.
#
# Applied as a profile patch layer after every in-box bundle. Inserts the plugin
# row at the profile root; later layers (or the user's own cordis.patch.yml) can
# address it by id, with the last write winning.
#
# The model-facing `homepage` tool ships off so it never sits in a model's
# context unasked. Turn it on in the Plugins settings page (the `exposeTool`
# switch), or by adding `config: { exposeTool: true }` to this row.
- insert:
    - id: dsh-homepage
      name: 'dsh-homepage'
